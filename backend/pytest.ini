[pytest]
pythonpath = .
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# The live group (tests/live) calls the real APIs; it runs only with -m live.
addopts = -m "not live"
markers =
    live: calls the real ElevenLabs, OpenAI, Anthropic and Firecrawl APIs with the keys in backend/.env (run with -m live)
filterwarnings =
    ignore::DeprecationWarning
